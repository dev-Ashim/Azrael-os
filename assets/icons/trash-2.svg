<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <linearGradient id="lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
    <linearGradient id="gl" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.4)"/></filter>
  </defs>
  <g filter="url(#s)">
    <!-- body -->
    <path d="M14 24 L16 56 Q16 60 20 60 L44 60 Q48 60 48 56 L50 24 Z" fill="url(#body)"/>
    <!-- glass shine on body -->
    <path d="M18 24 L19 52 Q19 55 22 55 L28 55 L26 24 Z" fill="url(#gl)"/>
    <!-- lid -->
    <rect x="10" y="18" width="44" height="7" rx="3.5" fill="url(#lid)"/>
    <!-- handle -->
    <rect x="24" y="10" width="16" height="9" rx="4" fill="url(#lid)"/>
    <rect x="27" y="13" width="10" height="3" rx="1.5" fill="rgba(0,0,0,0.15)"/>
    <!-- stripes -->
    <line x1="24" y1="30" x2="23" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="30" x2="32" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
    <line x1="40" y1="30" x2="41" y2="54" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
