<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </linearGradient>
    <linearGradient id="gl" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.35)"/></filter>
  </defs>
  <g filter="url(#s)">
    <rect x="6" y="4" width="52" height="56" rx="8" fill="url(#bg)"/>
    <!-- header bar -->
    <rect x="6" y="4" width="52" height="14" rx="8" fill="#F9A825"/>
    <rect x="6" y="11" width="52" height="7" fill="#F9A825"/>
    <!-- lines -->
    <line x1="14" y1="26" x2="50" y2="26" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="33" x2="50" y2="33" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="40" x2="50" y2="40" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="47" x2="38" y2="47" stroke="rgba(0,0,0,0.15)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- glass shine -->
    <rect x="6" y="4" width="52" height="28" rx="8" fill="url(#gl)"/>
    <!-- title text -->
    <text x="32" y="14" font-family="-apple-system,sans-serif" font-size="8" font-weight="bold" fill="white" text-anchor="middle">Notes</text>
  </g>
</svg>
