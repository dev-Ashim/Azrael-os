<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#b3d9f7"/>
    </radialGradient>
    <radialGradient id="inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddeeff"/>
    </radialGradient>
    <linearGradient id="gl" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,100,200,0.35)"/></filter>
  </defs>
  <g filter="url(#s)">
    <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
    <circle cx="32" cy="32" r="24" fill="url(#inner)"/>
    <!-- compass needle -->
    <polygon points="32,14 36,32 32,30 28,32" fill="#E53935"/>
    <polygon points="32,50 28,32 32,34 36,32" fill="#9E9E9E"/>
    <!-- tick marks -->
    <line x1="32" y1="8" x2="32" y2="12" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <line x1="56" y1="32" x2="52" y2="32" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="56" x2="32" y2="52" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="32" x2="12" y2="32" stroke="#555" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="3" fill="#333"/>
    <!-- glass shine -->
    <ellipse cx="26" cy="20" rx="12" ry="7" fill="url(#gl)" opacity="0.8"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>
</svg>
